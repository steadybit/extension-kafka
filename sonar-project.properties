sonar.projectKey=steadybit_extension-kafka
sonar.organization=steadybit

sonar.sources=.
sonar.exclusions=**/*_test.go
# test-dataset holds fixture programs for the e2e tests (their own Go modules), not extension code.
sonar.coverage.exclusions=test-dataset/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go

sonar.go.coverage.reportPaths=coverage.out,e2e/e2e-coverage-docker.out
